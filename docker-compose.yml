name: lifeline

# LocalStack provides local, open-source implementations of DynamoDB
# and S3 — see docs/local-development.md for the full picture of how
# this fits together with `sam local start-api` (backend/API) and Vite
# (frontend). This is the ONLY container this project runs directly;
# `sam local start-api` spins up its own short-lived Lambda containers
# per request on this same Docker network (see --docker-network in
# start.sh) so they can reach LocalStack by the service name below.

services:
  localstack:
    image: localstack/localstack:3.8
    container_name: lifeline-localstack
    ports:
      - "4566:4566"   # the one edge port all LocalStack services (S3, DynamoDB, ...) share
    environment:
      - SERVICES=dynamodb,s3
      - DEBUG=0
      - PERSISTENCE=1
      # Dummy credentials — LocalStack's community edition accepts any
      # value here; nothing real is ever charged or authenticated.
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - lifeline-localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    networks:
      - lifeline-net

networks:
  lifeline-net:
    name: lifeline-net

volumes:
  lifeline-localstack-data:
